<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>InkyPi Dashboard</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            position: fixed;
            inset: 0;

            margin: 0;
            padding: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #000;
        }

        .pages {
            position: absolute;
            inset: 0;

            display: flex;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            overflow-x: auto;
            overflow-y: hidden;

            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;

            scrollbar-width: none;
        }

        .pages::-webkit-scrollbar {
            display: none;
        }

        .page {
            position: relative;

            flex: 0 0 100vw;

            width: 100vw;
            min-width: 100vw;
            max-width: 100vw;

            height: 100vh;
            min-height: 100vh;
            max-height: 100vh;

            margin: 0;
            padding: 0;

            overflow: hidden;

            scroll-snap-align: start;
            scroll-snap-stop: always;

            background: #000;
        }

        .plugin-display {
            position: absolute;
            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            max-width: none;
            max-height: none;

            margin: 0;
            padding: 0;

            border: 0;

            object-fit: fill;
            object-position: center;
        }
    </style>
</head>

<body>

<main class="pages">

    {% for page in pages %}
    <section class="page">
        <img
            class="plugin-display"
            data-src="{{ url_for(
                'plugin.plugin_instance_image',
                playlist_name=page.playlist_name,
                plugin_id=page.plugin_id,
                instance_name=page.instance_name
            ) }}"
            src="{{ url_for(
                'plugin.plugin_instance_image',
                playlist_name=page.playlist_name,
                plugin_id=page.plugin_id,
                instance_name=page.instance_name
            ) }}"
            alt="{{ page.instance_name }}"
            draggable="false"
        >
    </section>
    {% endfor %}

</main>

<script>
    const IMAGE_REFRESH_INTERVAL = 60_000;

    async function refreshPluginImage(image) {
        const baseUrl = image.dataset.src;

        try {
            const refreshUrl =
                `${baseUrl}?t=${Date.now()}`;

            const response = await fetch(refreshUrl, {
                cache: "no-store"
            });

            if (!response.ok) {
                console.error(
                    `Failed to refresh ${baseUrl}:`,
                    response.status
                );
                return;
            }

            const blob = await response.blob();
            const objectUrl = URL.createObjectURL(blob);

            const oldObjectUrl = image.dataset.objectUrl;

            image.onload = () => {
                if (oldObjectUrl) {
                    URL.revokeObjectURL(oldObjectUrl);
                }
            };

            image.dataset.objectUrl = objectUrl;
            image.src = objectUrl;

            console.log(
                `Refreshed ${baseUrl} at`,
                new Date().toLocaleTimeString()
            );

        } catch (error) {
            console.error(
                `Error refreshing ${baseUrl}:`,
                error
            );
        }
    }

    function refreshPluginImages() {
        document
            .querySelectorAll(".plugin-display")
            .forEach(refreshPluginImage);
    }

    setTimeout(refreshPluginImages, 5000);

    setInterval(
        refreshPluginImages,
        IMAGE_REFRESH_INTERVAL
    );
</script>

</body>
</html>
