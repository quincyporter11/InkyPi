<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>InkyPi Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        .pages {
            display: flex;
            width: 100vw;
            height: 100vh;

            overflow-x: auto;
            overflow-y: hidden;

            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;

            scrollbar-width: none;
        }

        .pages::-webkit-scrollbar {
            display: none;
        }

        .page {
            flex: 0 0 100vw;
            width: 100vw;
            height: 100vh;

            scroll-snap-align: start;
            scroll-snap-stop: always;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: clamp(3rem, 10vw, 8rem);
        }
    </style>
</head>

<body>

    <main class="pages">
        <section class="page">
            Weather
        </section>

        <section class="page">
            Calendar
        </section>

        <section class="page">
            Home
        </section>
    </main>

</body>
</html>
