<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>InkyPi Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }

        .pages {
            display: flex;
            width: 100vw;
            height: 100vh;

            overflow-x: auto;
            overflow-y: hidden;

            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;

            scrollbar-width: none;
        }

        .pages::-webkit-scrollbar {
            display: none;
        }

        .page {
            flex: 0 0 100vw;
            width: 100vw;
            height: 100vh;

            scroll-snap-align: start;
            scroll-snap-stop: always;

            display: flex;
            align-items: center;
            justify-content: center;

           /* font-size: clamp(3rem, 10vw, 8rem);*/
        }

        .weather-page {
            width: 100%;
            height: 100%;
            padding: 3rem;

            display: flex;
            flex-direction: column;

            gap: 2rem;
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-header h1 {
            margin: 0;
            font-size: 3rem;
        }

        .weather-header .date {
            font-size: 1.5rem;
        }

        .current {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .current img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        .temperature {
            font-size: 4rem;
            font-weight: bold;
        }

        .feels-like {
            font-size: 1.25rem;
        }

        .hourly {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }

        .hour {
            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 0.5rem;

            font-size: 1rem;
        }

        .hour img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .forecast {
            display: flex;
            justify-content: space-around;
            margin-top: auto;
        }

        .forecast-day {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 0.5rem;

            font-size: 1.25rem;
        }

        .forecast-day img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <main class="pages">
        <section class="page">
            {% include "dashboard/pages/weather.html" %}
        </section>

        <section class="page">
            Calendar
        </section>

        <section class="page">
            Home
        </section>
    </main>

</body>
</html>
